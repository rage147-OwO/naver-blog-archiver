name: Deploy to Oracle

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'rage147-OwO/naver-blog-archiver' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 130
    steps:
      - name: Deploy the current master commit
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.OCI_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -f -- "$ssh_dir/key" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          ssh -T -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=3 \
            naver-archiver-deploy@129.203.180.63 "deploy $GITHUB_SHA"
